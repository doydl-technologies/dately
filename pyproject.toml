[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "Cython>=3.0.10,<3.1; python_version < '3.9'",
    "Cython>=3.1; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py38"
line-length = 120
exclude = ["build"]

[tool.cibuildwheel]
build = "cp{38,39,310,311,312,313,314}-*"
skip = "*-musllinux_*"
test-requires = ["pytest", "packaging"]
test-command = "python -m pytest {project}/tests --rootdir={project}/tests"
environment = { DATELY_TEST_INSTALLED = "1" }

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

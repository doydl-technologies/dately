[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "Cython>=3.0.10,<3.1; python_version < '3.9'",
    "Cython>=3.1; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib --rootdir=tests"

[tool.ruff]
target-version = "py38"
line-length = 120
exclude = ["build"]

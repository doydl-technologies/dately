name: Publish GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v4.7.6)
        required: true
        type: string
      run_id:
        description: Successful Build Python downloads run for that exact tag commit
        required: true
        type: string
  workflow_run:
    workflows: [Build Python downloads]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: dately-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'doydl-technologies/dately' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      run_id: ${{ steps.release.outputs.run_id }}
    steps:
      - name: Verify build provenance and tag commit
        id: release
        uses: actions/github-script@v8
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const runId = process.env.INPUT_RUN_ID || context.payload.workflow_run?.id;
            if (!/^\d+$/.test(String(runId))) throw new Error('A valid build run ID is required');
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: Number(runId)});
            if (run.conclusion !== 'success' || !['push', 'workflow_dispatch'].includes(run.event) ||
                run.head_repository?.full_name !== `${owner}/${repo}` ||
                run.path.split('@')[0] !== '.github/workflows/build-downloads.yml') {
              throw new Error('Expected a successful trusted Build Python downloads run');
            }
            const tag = process.env.INPUT_TAG || run.head_branch;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a stable vX.Y.Z release tag');
            const {data: ref} = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
            let object = ref.object;
            for (let depth = 0; object.type === 'tag' && depth < 10; depth++) {
              const {data: annotated} = await github.rest.git.getTag({owner, repo, tag_sha: object.sha});
              object = annotated.object;
            }
            if (object.type !== 'commit' || object.sha !== run.head_sha) {
              throw new Error('Release tag does not point to the tested build commit');
            }
            core.setOutput('tag', tag);
            core.setOutput('sha', object.sha);
            core.setOutput('run_id', String(runId));
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
          pattern: dately-*
          path: artifacts
      - name: Validate all platform and Python artifacts
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python scripts/release_checks.py --tag "$RELEASE_TAG" --artifacts artifacts
      - name: Upload complete draft, then publish
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG;
            async function collect(directory) {
              const files = [];
              for (const entry of await fs.readdir(directory, {withFileTypes: true})) {
                const full = path.join(directory, entry.name);
                if (entry.isDirectory()) files.push(...await collect(full));
                else if (entry.name.endsWith('.whl') || entry.name.endsWith('.tar.gz')) files.push(full);
              }
              return files;
            }
            const files = (await collect('artifacts')).sort();
            let body = await fs.readFile(`release-notes/${tag}.md`, 'utf8');
            if (!body.startsWith(`# ${tag}\n`)) throw new Error('Approved notes do not match the release tag');
            body = body.replace('Full changelog (planned; requires the ' + tag + ' tag)', 'Full changelog');
            let release;
            try {
              ({data: release} = await github.rest.repos.getReleaseByTag({owner, repo, tag}));
              if (!release.draft) throw new Error('Refusing to replace an already published release');
              ({data: release} = await github.rest.repos.updateRelease({owner, repo, release_id: release.id, name: tag, body}));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({data: release} = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: process.env.RELEASE_SHA,
                name: tag, body, draft: true, prerelease: false,
              }));
            }
            const crypto = require('node:crypto');
            const sums = [];
            for (const file of files) {
              const data = await fs.readFile(file);
              const digest = crypto.createHash('sha256').update(data).digest('hex');
              sums.push(`${digest}  ${path.basename(file)}`);
              const existing = release.assets.find(asset => asset.name === path.basename(file));
              if (existing) {
                const {data: downloaded} = await github.rest.repos.getReleaseAsset({
                  owner, repo, asset_id: existing.id, headers: {accept: 'application/octet-stream'},
                });
                if (crypto.createHash('sha256').update(Buffer.from(downloaded)).digest('hex') !== digest) {
                  throw new Error(`Existing draft asset differs: ${existing.name}`);
                }
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: path.basename(file),
                data,
              });
            }
            if (!release.assets.some(asset => asset.name === 'SHA256SUMS')) {
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: 'SHA256SUMS',
                data: Buffer.from(sums.join('\n') + '\n'),
              });
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, make_latest: 'true'});
            core.notice(`Published ${tag} with ${files.length} validated downloads`);

  pypi:
    name: Publish package to PyPI with trusted publishing
    needs: publish
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/dately/
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.publish.outputs.run_id }}
          pattern: dately-*
          path: dist
          merge-multiple: true
      - name: Validate exact tagged distributions
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: python scripts/release_checks.py --tag "$RELEASE_TAG" --artifacts dist
      - name: Publish using GitHub OIDC identity
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Finalize publication links
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG;
            const {data: release} = await github.rest.repos.getReleaseByTag({owner, repo, tag});
            const body = release.body
              .replace(/This draft describes the planned `[^`]+` release\. The pinned command below becomes usable after that version is published to PyPI\. /, '')
              .replace('PyPI release (planned; available after publication)', 'PyPI release');
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, body});

name: Publish GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v4.7.7)
        required: true
        type: string
      run_id:
        description: Successful Build Python downloads run for that exact tag commit
        required: true
        type: string
  workflow_run:
    workflows: [Build Python downloads]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: dately-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'doydl-technologies/dately' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      run_id: ${{ steps.release.outputs.run_id }}
    steps:
      - name: Verify build provenance and tag commit
        id: release
        uses: actions/github-script@v8
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const runId = process.env.INPUT_RUN_ID || context.payload.workflow_run?.id;
            if (!/^\d+$/.test(String(runId))) throw new Error('A valid build run ID is required');
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: Number(runId)});
            if (run.conclusion !== 'success' || !['push', 'workflow_dispatch'].includes(run.event) ||
                run.head_repository?.full_name !== `${owner}/${repo}` ||
                run.path.split('@')[0] !== '.github/workflows/build-downloads.yml') {
              throw new Error('Expected a successful trusted Build Python downloads run');
            }
            const tag = process.env.INPUT_TAG || run.head_branch;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a stable vX.Y.Z release tag');
            const {data: ref} = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
            let object = ref.object;
            for (let depth = 0; object.type === 'tag' && depth < 10; depth++) {
              const {data: annotated} = await github.rest.git.getTag({owner, repo, tag_sha: object.sha});
              object = annotated.object;
            }
            if (object.type !== 'commit' || object.sha !== run.head_sha) {
              throw new Error('Release tag does not point to the tested build commit');
            }
            core.setOutput('tag', tag);
            core.setOutput('sha', object.sha);
            core.setOutput('run_id', String(runId));
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Prepare release checks
        shell: bash
        run: &prepare-release-checks |
          python - <<"PY"
          import os
          from pathlib import Path
          code = r'''
          """Version/provenance-independent artifact checks used by build and release CI."""

          import argparse
          import ast
          import re
          from pathlib import Path

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          PYTHONS = {f"cp3{minor}" for minor in range(8, 15)}
          PLATFORMS = {"windows-x64", "linux-x64", "macos-x64", "macos-arm64"}


          def source_version(root):
              tree = ast.parse((Path(root) / "_version.py").read_text(encoding="utf-8"))
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(
                      isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets
                  ):
                      return Version(ast.literal_eval(node.value))
              raise ValueError("Missing __version__ declaration")


          def verify_tag(root, tag):
              if not tag.startswith("v") or Version(tag[1:]) != source_version(root):
                  raise ValueError(f"Tag {tag!r} does not match source version {source_version(root)}")
              return Version(tag[1:])


          def platform_family(platform):
              if platform == "win_amd64":
                  return "windows-x64"
              # auditwheel may emit legacy policy aliases alongside PEP 600 tags in
              # the same wheel (for example manylinux2014 + manylinux_2_17).
              if re.fullmatch(r"manylinux(?:1|2010|2014|_[0-9]+_[0-9]+)_x86_64", platform):
                  return "linux-x64"
              if platform.startswith("macosx_"):
                  if platform.endswith("_arm64"):
                      return "macos-arm64"
                  if platform.endswith("_x86_64"):
                      return "macos-x64"
              raise ValueError(f"Unexpected wheel platform: {platform}")


          def verify_artifacts(root, version):
              """Require every supported Python/platform pair and one matching sdist.

              Multi-policy Linux tags may cover the same pair within one wheel. Validation
              checks coverage rather than a hard-coded total wheel count.
              """
              version = Version(str(version))
              covered, files = set(), []
              for path in sorted(Path(root).rglob("*.whl")):
                  name, wheel_version, _, tags = parse_wheel_filename(path.name)
                  if name != "dately" or wheel_version != version:
                      raise ValueError(f"Wrong package/version: {path.name}")
                  pairs = set()
                  for tag in tags:
                      if tag.interpreter not in PYTHONS or tag.abi != tag.interpreter:
                          raise ValueError(f"Unexpected Python/ABI tag in {path.name}: {tag}")
                      pairs.add((tag.interpreter, platform_family(tag.platform)))
                  if pairs & covered:
                      raise ValueError(f"Duplicate Python/platform coverage: {path.name}")
                  covered.update(pairs)
                  files.append(path)
              missing = {(python, platform) for python in PYTHONS for platform in PLATFORMS} - covered
              if missing:
                  raise ValueError(f"Missing wheel coverage: {sorted(missing)}")
              sources = sorted(Path(root).rglob("*.tar.gz"))
              if len(sources) != 1 or parse_sdist_filename(sources[0].name) != ("dately", version):
                  raise ValueError("Expected one dately source archive matching the release version")
              return files + sources


          """Check source syntax and distribution metadata and contents."""

          import argparse
          import ast
          import py_compile
          import subprocess
          import tarfile
          import tempfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          from packaging.specifiers import SpecifierSet

          ROOT = Path.cwd()


          def check_source():
              source_version(ROOT)
              setup = ast.parse((ROOT / "setup.py").read_text(encoding="utf-8"))
              call = next(n for n in ast.walk(setup) if isinstance(n, ast.Call) and getattr(n.func, "id", None) == "setup")
              metadata = {item.arg: item.value for item in call.keywords}
              requires = ast.literal_eval(metadata["python_requires"])
              assert requires == ">=3.8,<3.15", "Unexpected Python support metadata"
              assert ast.literal_eval(metadata["name"]) == "dately"
              assert (ROOT / "CHANGELOG.md").is_file()
              paths = subprocess.check_output(["git", "ls-files", "--cached", "--others", "--exclude-standard"], cwd=ROOT)
              with tempfile.TemporaryDirectory() as cache:
                  for index, relative in enumerate(paths.decode().splitlines()):
                      if relative.endswith(".py"):
                          py_compile.compile(str(ROOT / relative), cfile=str(Path(cache) / f"{index}.pyc"), doraise=True)


          def check_archive(path):
              version = str(source_version(ROOT))
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
                      metadata_name = f"dately-{version}.dist-info/METADATA"
                      metadata = BytesParser().parsebytes(archive.read(metadata_name))
                      required = {
                          f"dately/{name}"
                          for name in (
                              "__init__.py",
                              "_version.py",
                              "files/holiday.json",
                              "files/country_variants.json",
                              "files/timezone_data.json",
                          )
                      }
                      assert required <= set(names), f"Missing runtime resources: {path.name}"
                      extensions = [name for name in names if name.endswith((".pyd", ".so"))]
                      assert len(extensions) == 7, f"Expected seven native extensions: {path.name}"
                      assert "dately/setup.py" not in names
              else:
                  with tarfile.open(path, "r:gz") as archive:
                      names = archive.getnames()
                      prefix = f"dately-{version}/"
                      metadata = BytesParser().parsebytes(archive.extractfile(prefix + "PKG-INFO").read())
                      required = {
                          prefix + name
                          for name in (
                              "setup.py",
                              "pyproject.toml",
                              "CHANGELOG.md",
                              "mold/include/iso8601Z.h",
                              "mold/pyx/iso8601Z.pyx",
                              "mold/src/iso8601Z_impl.c",
                          )
                      }
                      assert required <= set(names), f"Missing source/build resources: {path.name}"
                      assert not any(name.endswith((".pyd", ".so", ".dylib")) for name in names), (
                          "Source archive contains native binaries"
                      )
              assert metadata["Name"] == "dately" and metadata["Version"] == version
              assert metadata["Requires-Python"] == ">=3.8,<3.15"
              assert "3.13" in SpecifierSet(metadata["Requires-Python"])
              assert not any(".venv" in name or ".publishing-creds" in name or "/.git/" in name for name in names)
              assert not any("release-audit" in name or "release-history-docs" in name for name in names)
              print(f"Checked {path.name}")


          parser = argparse.ArgumentParser()
          parser.add_argument("--tag")
          parser.add_argument("--source", action="store_true")
          parser.add_argument("--artifacts", type=Path)
          parser.add_argument("archives", nargs="*", type=Path)
          args = parser.parse_args()
          version = verify_tag(ROOT, args.tag) if args.tag else source_version(ROOT)
          if args.source:
              check_source()
          if args.artifacts:
              verify_artifacts(args.artifacts, version)
          for archive in args.archives:
              check_archive(archive)
          print("Release checks passed")
          '''
          Path(os.environ["RUNNER_TEMP"], "dately-checks.py").write_text(code, encoding="utf-8")
          PY
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
          pattern: dately-*
          path: artifacts
      - name: Validate all platform and Python artifacts
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python "$RUNNER_TEMP/dately-checks.py" --tag "$RELEASE_TAG" --artifacts artifacts
      - name: Upload complete draft, then publish
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG;
            async function collect(directory) {
              const files = [];
              for (const entry of await fs.readdir(directory, {withFileTypes: true})) {
                const full = path.join(directory, entry.name);
                if (entry.isDirectory()) files.push(...await collect(full));
                else if (entry.name.endsWith('.whl') || entry.name.endsWith('.tar.gz')) files.push(full);
              }
              return files;
            }
            const files = (await collect('artifacts')).sort();
            // The tag lookup endpoint only returns published releases. List releases
            // with this job's contents:write token to include the approved draft.
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            const matching = releases.filter(release => release.tag_name === tag);
            if (matching.length === 0) {
              throw new Error('Create a draft GitHub release with the approved notes before publishing');
            }
            if (matching.length !== 1) throw new Error('Expected exactly one release for the tag');
            const release = matching[0];
            if (!release.draft) throw new Error('Refusing to replace an already published release');
            const body = release.body || '';
            if (!/^> \[!NOTE\]\r?\n/.test(body)) {
              throw new Error('The release description must start with the NOTE callout; keep the version in the release title');
            }
            const summary = body.match(/^> \[!NOTE\]\r?\n> \*\*([^\r\n]+)\*\*[ \t]*(?:\r?\n|$)/);
            if (!summary || !summary[1].trim() || summary[1].trim().split(/\s+/).length > 11) {
              throw new Error('Approved notes need a bold summary of eleven words or fewer in a NOTE');
            }
            if (/\[(VERSION|REPO-NAME|PREVIOUS_TAG|CURRENT_TAG)\]/.test(body)) {
              throw new Error('Approved notes contain unresolved placeholders');
            }
            const version = tag.slice(1);
            if (!body.includes(`python -m pip install --upgrade dately==${version}`)) {
              throw new Error('Approved notes need the matching pinned install command');
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, name: tag});
            const crypto = require('node:crypto');
            const sums = [];
            for (const file of files) {
              const data = await fs.readFile(file);
              const digest = crypto.createHash('sha256').update(data).digest('hex');
              sums.push(`${digest}  ${path.basename(file)}`);
              const existing = release.assets.find(asset => asset.name === path.basename(file));
              if (existing) {
                const {data: downloaded} = await github.rest.repos.getReleaseAsset({
                  owner, repo, asset_id: existing.id, headers: {accept: 'application/octet-stream'},
                });
                if (crypto.createHash('sha256').update(Buffer.from(downloaded)).digest('hex') !== digest) {
                  throw new Error(`Existing draft asset differs: ${existing.name}`);
                }
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: path.basename(file),
                data,
              });
            }
            if (!release.assets.some(asset => asset.name === 'SHA256SUMS')) {
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: 'SHA256SUMS',
                data: Buffer.from(sums.join('\n') + '\n'),
              });
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, make_latest: 'true'});
            core.notice(`Published ${tag} with ${files.length} validated downloads`);

  pypi:
    name: Publish package to PyPI with trusted publishing
    needs: publish
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/dately/
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Prepare release checks
        shell: bash
        run: *prepare-release-checks
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.publish.outputs.run_id }}
          pattern: dately-*
          path: dist
          merge-multiple: true
      - name: Validate exact tagged distributions
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: python "$RUNNER_TEMP/dately-checks.py" --tag "$RELEASE_TAG" --artifacts dist
      - name: Publish using GitHub OIDC identity
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Finalize publication links
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = process.env.RELEASE_TAG;
            const {data: release} = await github.rest.repos.getReleaseByTag({owner, repo, tag});
            const body = release.body
              .replace(/This draft describes the planned `[^`]+` release\. The pinned command below becomes usable after that version is published to PyPI\. /, '')
              .replace('PyPI release (planned; available after publication)', 'PyPI release');
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, body});
